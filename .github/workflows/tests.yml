name: Tests de QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      # Va antes de instalar nada: si el código no sigue las normas, el CI falla en segundos
      - name: Revisar las normas del framework
        run: python scripts/revisar_reglas_qa.py

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Higiene general del código: imports sin usar, errores típicos, orden de imports
      - name: Revisar el código con Ruff
        run: ruff check .

      - name: Instalar el navegador
        run: python -m playwright install --with-deps chromium

      - name: Ejecutar los tests
        env:
          SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
        run: pytest -v --html=informe.html --self-contained-html

      - name: Guardar el informe
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: informe-tests
          path: informe.html

      - name: Guardar trazas y capturas de los fallos
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: trazas-fallos
          path: test-results/
